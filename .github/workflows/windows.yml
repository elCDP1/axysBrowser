name: Windows build (experimental)

# Experimental and currently expected to fail: the crate depends on webkit6,
# which this job does not build. It runs manually only, so it does not turn
# every push red.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      # Force Node 24 to satisfy GitHub's newer JavaScript action rules.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native Windows Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MSVC build tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install native dependencies
        run: |
          pip install gvsbuild
          # webkit6 is intentionally skipped for now: it takes hours to build
          # in CI. This checks that the crate structure compiles; WebKit is
          # added later once that step is viable.
          gvsbuild build gtk4 libsoup
        shell: pwsh

      - name: Build browser (Cargo)
        run: |
          $env:Path += ";C:\gtk-build\gtk\x64\release\bin"
          $env:PKG_CONFIG_PATH = "C:\gtk-build\gtk\x64\release\lib\pkgconfig"

          cargo build --release --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Upload executable and DLLs
        uses: actions/upload-artifact@v4
        with:
          name: axysbrowser-windows-build
          path: |
            target/x86_64-pc-windows-msvc/release/axysbrowser.exe
            C:/gtk-build/gtk/x64/release/bin/*.dll
