version: 2

updates:
  # Keeps the workflow actions current (and lets them be pinned by commit).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Dependency updates also arrive as small, reviewable PRs; `cargo audit`
  # in CI still gates known advisories.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
