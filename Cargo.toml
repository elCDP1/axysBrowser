[package]
name = "axysbrowser"
version = "1.1.4"
edition = "2024"
rust-version = "1.92"
description = "A lightweight, privacy-focused Linux web browser built with Rust, GTK4 and WebKitGTK"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/elCDP1/axysBrowser"
homepage = "https://github.com/elCDP1/axysBrowser"
authors = ["elCDP1"]
keywords = ["browser", "gtk4", "webkitgtk", "privacy", "linux"]
categories = ["gui"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
webkit6 = { version = "0.6.1", features = ["v2_52"] }
webkit6-sys = "0.6.0"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
url = "2"
rust-i18n = "4.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
