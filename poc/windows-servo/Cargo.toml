[package]
name = "axys-servo-poc"
version = "0.1.0"
edition = "2024"
publish = false
description = "axysBrowser Windows port: Servo embedding proof of concept"

# Standalone workspace: this crate is not part of the Linux package and must
# never be pulled into the axysbrowser build.
[workspace]

[dependencies]
# `no-wgl` makes Servo go through ANGLE (EGL over D3D11) instead of WGL. A
# Windows machine without a vendor OpenGL driver — every CI runner, and plenty
# of real ones — cannot create a WGL context at all, and WARP then provides the
# D3D11 device underneath ANGLE. This is Servo's own supported route on Windows.
servo = { version = "0.7", features = ["no-wgl"] }
winit = "0.30"
euclid = "0.22"
url = "2"
# Must match the rustls major/minor Servo links, so the installed crypto
# provider is the one Servo's network stack actually uses.
rustls = "0.23"

[profile.dev]
# Servo is unusable unoptimised even in a debug build; the engine's own build
# notes ask embedders to optimise dependencies.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
