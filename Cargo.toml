[package]
name = "axysbrowser"
version = "1.0.0-beta.1"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
webkit6 = { version = "0.6.1", features = ["v2_52"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
url = "2"
rust-i18n = "4.2"
sys-locale = "0.3.2"
