name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # Weekly run on an unchanged tree: new RustSec advisories and new lints in
  # the floating `stable` toolchain show up here instead of on a random push.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install GTK4 / WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libjavascriptcoregtk-6.0-dev pkg-config

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  gui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install GTK4 / WebKitGTK / Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libjavascriptcoregtk-6.0-dev pkg-config xvfb bubblewrap

      - name: Enable WebKit sandbox namespaces
        run: bash .github/enable-sandbox.sh

      - name: Build (debug)
        run: cargo build --locked

      - name: GUI smoke under Xvfb
        run: xvfb-run -a bash .github/gui-smoke.sh

      - name: GUI smoke under Xvfb (sandbox enabled)
        run: xvfb-run -a bash .github/gui-smoke.sh strict

      - name: Memory smoke under Xvfb
        run: xvfb-run -a bash .github/mem-smoke.sh

      - name: Memory smoke under Xvfb (sandbox enabled)
        run: xvfb-run -a bash .github/mem-smoke.sh strict

  release:
    # The distributed profile uses LTO and was never built in CI; a
    # release-only breakage would reach users. Weekly, on the scheduled run.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install GTK4 / WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libjavascriptcoregtk-6.0-dev pkg-config

      - name: Build (release)
        run: cargo build --release --locked

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit
