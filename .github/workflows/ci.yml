name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install GTK4 / WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libjavascriptcoregtk-6.0-dev pkg-config

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  gui-smoke:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install GTK4 / WebKitGTK / Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libjavascriptcoregtk-6.0-dev pkg-config xvfb

      - name: Build (debug)
        run: cargo build --locked

      - name: GUI smoke under Xvfb
        run: xvfb-run -a bash .github/gui-smoke.sh

      - name: GUI smoke under Xvfb (sandbox enabled)
        run: xvfb-run -a bash .github/gui-smoke.sh strict

      - name: Memory smoke under Xvfb
        run: xvfb-run -a bash .github/mem-smoke.sh

  audit:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
