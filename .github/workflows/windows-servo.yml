name: Windows + Servo (proof of concept)

# Builds poc/windows-servo and runs its headless self-test on a native Windows
# runner. This is the gate that proves Servo embeds in a Windows process before
# any engine work starts on the `windows` branch.
#
# The self-test needs no GPU and no desktop session: Servo renders through ANGLE
# (EGL over D3D11, which falls back to WARP without a graphics card), so a green
# run means the engine initialised, loaded a page, executed JavaScript and
# produced pixels.

on:
  workflow_dispatch:
  push:
    branches: [ windows ]
    paths:
      - 'poc/windows-servo/**'
      - '.github/workflows/windows-servo.yml'
  pull_request:
    paths:
      - 'poc/windows-servo/**'
      - '.github/workflows/windows-servo.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  poc:
    runs-on: windows-2022
    # Servo compiles SpiderMonkey, ANGLE and several hundred crates on a cold
    # cache. This machine has done it in ~15 minutes; the rest is headroom.
    timeout-minutes: 240

    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_RETRY: '5'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native Windows Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      # The dependency build dominates the job; without the cache every push
      # pays the full SpiderMonkey + ANGLE cost again.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: poc/windows-servo
          # Bump to force a fresh engine build after a Servo upgrade.
          key: servo-0.7-angle
          # A red run is the normal state while the port is being fixed; without
          # this every iteration pays the full engine build again.
          cache-on-failure: true

      - name: Install NASM
        # aws-lc-sys (TLS) assembles with NASM; CMake is already on the image.
        run: |
          choco install nasm --no-progress -y
          if (Test-Path 'C:\ProgramData\chocolatey\bin\nasm.exe') {
            'C:\ProgramData\chocolatey\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Point bindgen at libclang
        # mozangle generates the ANGLE bindings with bindgen, which loads
        # libclang at build time.
        shell: pwsh
        run: |
          $candidates = @('C:\Program Files\LLVM\bin', 'C:\Program Files (x86)\LLVM\bin')
          foreach ($dir in $candidates) {
            if (Test-Path (Join-Path $dir 'libclang.dll')) {
              "LIBCLANG_PATH=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Output "LIBCLANG_PATH=$dir"
              break
            }
          }

      - name: Check formatting
        working-directory: poc/windows-servo
        run: cargo fmt --all --check

      # Compiler errors are re-emitted as annotations on purpose: check-run
      # annotations stay readable for a public repository without a token, so
      # a red run can be diagnosed from the outside instead of only in the UI.
      - name: Build
        working-directory: poc/windows-servo
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build.log'
          cargo build --locked --message-format=short 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            Get-Content $log |
              Select-String -Pattern 'error(\[|:)' |
              Select-Object -First 40 |
              ForEach-Object {
                $line = $_.Line -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                Write-Output "::error::$line"
              }
            exit 1
          }

      - name: Make the ANGLE DLLs loadable
        # Servo's `no-wgl` build reaches OpenGL ES through ANGLE, and ANGLE is
        # loaded from beside the executable. mozangle leaves libEGL/libGLESv2 in
        # its build output, so publish them next to the binary.
        working-directory: poc/windows-servo
        shell: pwsh
        run: |
          $out = 'target\debug'
          foreach ($name in @('libEGL.dll', 'libGLESv2.dll')) {
            $found = Get-ChildItem -Path 'target\debug\build' -Recurse -Filter $name -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              Copy-Item $found.FullName (Join-Path $out $name) -Force
              Write-Output "copied $($found.FullName) -> $out\$name"
            } else {
              Write-Output "::warning::$name was not produced by the build"
            }
          }

      - name: Self-test (headless, software rendering)
        working-directory: poc/windows-servo
        shell: pwsh
        # The test enforces its own 120 s deadline; this is the outer guard.
        timeout-minutes: 15
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'selftest.log'
          $env:RUST_BACKTRACE = '1'
          & .\target\debug\axys-servo-poc.exe --self-test --headless 2>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Output "self-test exit code: $code"
          if ($code -ne 0) {
            Get-Content $log |
              Select-Object -Last 40 |
              ForEach-Object {
                $line = $_ -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                Write-Output "::error::$line"
              }
          }
          exit $code
