name: Release

# A tag is the only thing that publishes, and the binary attached to the
# release is built here from the tagged commit: no local credentials and no
# asset that only exists on a contributor's machine.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Validate tag, Cargo.toml and README
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          # The status line wraps the version in backticks and continues with
          # a period; take the semver itself instead of parsing fields.
          readme_version="$(grep -m1 '^> Status:' README.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"

          test -n "$cargo_version"
          test "$version" = "$cargo_version" || {
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version" >&2
            exit 1
          }
          test "$readme_version" = "$cargo_version" || {
            echo "README status '$readme_version' does not match Cargo.toml version $cargo_version" >&2
            exit 1
          }

          echo "Version $cargo_version is consistent"

  verify:
    # This is the same gate a pull request runs, including the MSRV, lint,
    # GUI/sandbox smokes, release-profile build and dependency audit.
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install GTK4 / WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libjavascriptcoregtk-6.0-dev pkg-config

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package and verify the binary
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="axysbrowser-${version}-x86_64-linux"

          install -m 0755 target/release/axysbrowser "$asset"
          sha256sum "$asset" > "$asset.sha256"
          sha256sum -c "$asset.sha256"

          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "axysBrowser ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              "$ASSET" "$ASSET.sha256"
          fi
